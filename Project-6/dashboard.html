<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | Authentication System</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body data-page="dashboard">

    <main class="dashboard-container">

        <header class="dashboard-header">

            <div>
                <h1>My Dashboard</h1>
                <p>Your personal account area</p>
            </div>

            <button id="logoutBtn" class="logout-btn">
                Logout ↗
            </button>

        </header>


        <section class="welcome-card">

            <div class="dashboard-icon">👋</div>

            <h2>Welcome, <span id="displayUsername">User</span>!</h2>

            <p>
                You have successfully logged in to your account.
            </p>

            <div class="user-information">

                <div class="info-item">
                    <span>Username</span>
                    <strong id="userUsername">---</strong>
                </div>

                <div class="info-item">
                    <span>Email Address</span>
                    <strong id="userEmail">---</strong>
                </div>

                <div class="info-item">
                    <span>Account Created</span>
                    <strong id="userCreated">---</strong>
                </div>

                <div class="info-item">
                    <span>Account Status</span>
                    <strong class="active-status">Active</strong>
                </div>

            </div>

        </section>


        <footer class="dashboard-footer">
            <p>Thank you for using our Login Authentication System.</p>
        </footer>

    </main>

</body>
</html>
