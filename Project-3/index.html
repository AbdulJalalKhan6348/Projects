<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Calculator</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main class="container">

        <div class="calculator">

            <!-- Calculator Header -->
            <div class="header">
                <h1>Calculator</h1>
                <p>Simple calculations made easy</p>
            </div>

            <!-- Display Screen -->
            <div class="display">
                <div id="expression" class="expression">0</div>

                <div id="result" class="result">0</div>

                <p id="status" class="status">Ready</p>
            </div>

            <!-- Calculator Buttons -->
            <div class="buttons">

                <button class="key utility" data-action="clear">C</button>

                <button class="key utility" data-action="delete"
                    aria-label="Backspace">⌫</button>

                <button class="key operator" data-value="÷">÷</button>

                <button class="key operator" data-value="×">×</button>


                <button class="key" data-value="7">7</button>

                <button class="key" data-value="8">8</button>

                <button class="key" data-value="9">9</button>

                <button class="key operator" data-value="-">−</button>


                <button class="key" data-value="4">4</button>

                <button class="key" data-value="5">5</button>

                <button class="key" data-value="6">6</button>

                <button class="key operator" data-value="+">+</button>


                <button class="key" data-value="1">1</button>

                <button class="key" data-value="2">2</button>

                <button class="key" data-value="3">3</button>

                <button class="key equal" data-action="equals">=</button>


                <button class="key zero" data-value="0">0</button>

                <button class="key" data-value=".">.</button>

            </div>

        </div>

        <!-- Footer -->
        <footer>
            <p>© 2026 My Calculator | Built with HTML, CSS & JavaScript</p>
        </footer>

    </main>

</body>
</html>
